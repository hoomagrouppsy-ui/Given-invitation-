<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>GIVEN — پیش از رسیدن</title>

<style>

:root{
  --navy:#0B1830;
  --ivory:#F3EFE4;
  --gold:#D1B15B;
  --muted:#AAB0B8;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--navy);
  color:var(--ivory);
  font-family:Tahoma,Arial,sans-serif;
  min-height:100vh;
}

.wrap{
  min-height:100vh;
  max-width:560px;
  margin:auto;
  padding:54px 28px 34px;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}

/* GOLD CURVE */

.curve{
  position:absolute;
  width:470px;
  height:470px;
  border:1px solid rgba(209,177,91,.42);
  border-radius:50%;
  left:-345px;
  top:75px;
  pointer-events:none;
}

/* BRAND */

.brand{
  direction:ltr;
  text-align:left;
  font-size:11px;
  letter-spacing:.26em;
  color:var(--gold);
  margin-bottom:42px;
}

.given{
  direction:ltr;
  text-align:left;
  color:var(--gold);
  font-size:43px;
  letter-spacing:.12em;
  font-weight:500;
  margin:0 0 19px;
}

/* INTRO */

.intro{
  text-align:right;
  font-size:16px;
  line-height:2;
  margin:0;
  max-width:410px;
}

.date{
  direction:ltr;
  text-align:right;
  margin-top:27px;
  font-size:12px;
  letter-spacing:.13em;
  color:var(--gold);
}

.rule{
  width:54px;
  border-top:1px solid var(--gold);
  margin:30px 0;
}

/* ARRIVAL */

.arrival{
  text-align:right;
  font-size:14px;
  line-height:2.1;
  color:#ddd9cf;
}

.arrival strong{
  color:var(--ivory);
  font-weight:500;
}

/* ADDRESS */

.address{
  margin-top:27px;
  padding-top:22px;
  border-top:1px solid rgba(243,239,228,.12);
}

.address-fa{
  text-align:right;
  font-size:13px;
  line-height:2;
  color:#ddd9cf;
}

/* BEFORE ARRIVAL */

.before{
  margin-top:42px;
  font-size:13px;
  color:var(--gold);
  text-align:right;
}

.group{
  margin-top:30px;
}

.group-title{
  font-size:12px;
  color:var(--muted);
  margin-bottom:15px;
  text-align:right;
}

.options{
  display:grid;
  grid-template-columns:1fr;
  gap:9px;
}

.option{
  position:relative;
}

.option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.option label{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:13px 15px;
  border:1px solid rgba(243,239,228,.18);
  cursor:pointer;
  font-size:13px;
  transition:.2s ease;
}

.circle{
  width:13px;
  height:13px;
  border:1px solid var(--gold);
  border-radius:50%;
  flex:0 0 auto;
  position:relative;
}

.option input:checked + label{
  border-color:var(--gold);
  background:rgba(209,177,91,.06);
}

.option input:checked + label .circle:after{
  content:"";
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--gold);
  left:3px;
  top:3px;
}

/* NAME */

.name-label{
  display:block;
  margin-top:34px;
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px;
  text-align:right;
}

.name-input{
  width:100%;
  background:transparent;
  border:0;
  border-bottom:1px solid rgba(243,239,228,.35);
  color:var(--ivory);
  padding:11px 2px;
  font-size:16px;
  outline:none;
  direction:rtl;
  text-align:right;
}

.name-input:focus{
  border-color:var(--gold);
}

/* BUTTON */

.confirm{
  display:block;
  width:100%;
  margin-top:34px;
  padding:16px;
  border:1px solid var(--gold);
  background:transparent;
  color:var(--ivory);
  font-family:Tahoma,Arial,sans-serif;
  font-size:13px;
  cursor:pointer;
}

.confirm:disabled{
  opacity:.55;
}

/* ERROR */

.error{
  min-height:20px;
  margin-top:14px;
  text-align:right;
  font-size:12px;
  color:var(--gold);
  line-height:1.8;
}
<!-- SUCCESS PAGE -->

<section
  class="success"
  id="success"
>

  <div class="eyebrow">
    انتخابت ثبت شد.
  </div>

  <h2>
    منتظرت هستیم.
  </h2>

  <div style="
    margin-top:38px;
    padding-top:24px;
    border-top:1px solid rgba(209,177,91,.28);
    font-size:13px;
    line-height:2.1;
    color:#ddd9cf;
    max-width:430px;
  ">
    از آن‌جا که این بار، به‌طور اتفاقی، همه‌ی مهمانان GIVEN خانم هستند،
    برای پوشش هم هر آنچه با آن راحت‌ترید انتخاب کنید.
  </div>

  <div class="final-given">
    GIVEN
  </div>

</section>
